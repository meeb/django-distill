name: Run Django tests for django-distill
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['5.2', '6.0', '6.1']
        exclude:
          - django-version: '6.0'
            python-version: '3.10'
          - django-version: '6.0'
            python-version: '3.11'
          - django-version: '6.1'
            python-version: '3.10'
          - django-version: '6.1'
            python-version: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7.0.1
      - name: Install uv and setup Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[test]"
          uv pip install --system "Django==${{ matrix.django-version }}.*"
      - name: Run Django tests
        run: uv run manage.py testsuite
